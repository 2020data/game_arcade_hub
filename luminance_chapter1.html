<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>《空明・見性》全五章禪風互動合輯</title>
  <!-- Tailwind CSS for responsive layout & clean utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Elegant Traditional Chinese Serif Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       ZEN INK-WASH & LUMINOUS DESIGN TOKENS
       ========================================================================= */
    :root {
      --ink-midnight: #0b0d17;
      --ink-deep: #151424;
      --lavender-soft: #c4b5fd;
      --lavender-mid: #a78bfa;
      --gold-warm: #fbbf24;
      --gold-pale: #fef08a;
      --paper-mist: #f5f1e8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--ink-midnight);
      color: var(--paper-mist);
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
      touch-action: none;
    }

    /* Fullscreen High-DPI Canvas */
    #mainCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* Subtle Xuan-Paper Grain Overlay */
    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.04;
      background-image: radial-gradient(rgba(255, 255, 255, 0.45) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Glassmorphic Ink Cards */
    .ink-card {
      background: linear-gradient(160deg, rgba(20, 18, 34, 0.84) 0%, rgba(11, 13, 23, 0.92) 100%);
      border: 1px solid rgba(196, 181, 253, 0.22);
      box-shadow:
        0 20px 56px rgba(0, 0, 0, 0.58),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Chapter Hub Card Hover & Completed Golden Seal Glow */
    .chapter-card {
      background: linear-gradient(155deg, rgba(24, 21, 42, 0.78) 0%, rgba(13, 14, 26, 0.86) 100%);
      border: 1px solid rgba(167, 139, 250, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .chapter-card:hover {
      transform: translateY(-3px);
      border-color: rgba(254, 240, 138, 0.58);
      background: linear-gradient(155deg, rgba(36, 29, 62, 0.88) 0%, rgba(18, 17, 34, 0.92) 100%);
      box-shadow: 0 14px 36px rgba(167, 139, 250, 0.2), 0 0 22px rgba(251, 191, 36, 0.14);
    }

    .chapter-card.completed {
      border-color: rgba(251, 191, 36, 0.52);
      box-shadow: 0 8px 28px rgba(251, 191, 36, 0.14), inset 0 0 20px rgba(254, 240, 138, 0.06);
    }

    /* Primary Zen Gold-Lavender Button */
    .zen-btn {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.32), rgba(251, 191, 36, 0.26));
      border: 1px solid rgba(254, 240, 138, 0.5);
      color: #fdf9f0;
      letter-spacing: 0.22em;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 6px 24px rgba(167, 139, 250, 0.22);
    }

    .zen-btn:hover {
      border-color: rgba(254, 240, 138, 0.9);
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.48), rgba(251, 191, 36, 0.36));
      box-shadow: 0 10px 30px rgba(251, 191, 36, 0.28);
      transform: translateY(-1px);
    }

    .zen-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .zen-btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(196, 181, 253, 0.3);
      color: rgba(245, 241, 232, 0.9);
      letter-spacing: 0.16em;
      transition: all 0.3s ease;
    }

    .zen-btn-secondary:hover {
      background: rgba(196, 181, 253, 0.15);
      border-color: rgba(196, 181, 253, 0.65);
      color: #ffffff;
    }

    /* Light-theme button for Chapter 5 Pure White Void */
    .zen-btn-light {
      background: linear-gradient(135deg, rgba(254, 240, 138, 0.45), rgba(196, 181, 253, 0.42));
      border: 1px solid rgba(180, 142, 68, 0.55);
      color: #463761;
      letter-spacing: 0.22em;
      box-shadow: 0 10px 30px rgba(167, 139, 250, 0.28);
      transition: all 0.35s ease;
    }

    .zen-btn-light:hover {
      background: linear-gradient(135deg, rgba(254, 240, 138, 0.7), rgba(196, 181, 253, 0.6));
      border-color: rgba(180, 142, 68, 0.9);
      transform: translateY(-1px);
    }

    /* Global Top Navigation Buttons */
    .hud-btn {
      background: rgba(11, 13, 23, 0.52);
      border: 1px solid rgba(196, 181, 253, 0.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.35s ease;
      color: #f5f1e8;
    }

    .hud-btn:hover {
      border-color: rgba(254, 240, 138, 0.65);
      background: rgba(30, 26, 52, 0.72);
    }

    .hud-btn.light-theme {
      background: rgba(255, 255, 255, 0.65);
      border-color: rgba(167, 139, 250, 0.38);
      color: #4a3b66;
    }

    .hud-btn.light-theme:hover {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(217, 169, 66, 0.75);
    }

    /* Custom Zen Range Slider (Chapter 3) */
    input[type="range"].zen-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(167, 139, 250, 0.35), rgba(254, 240, 138, 0.7));
      outline: none;
      cursor: pointer;
    }

    input[type="range"].zen-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fef08a 55%, #a78bfa 100%);
      border: 1.5px solid rgba(255, 252, 235, 0.92);
      box-shadow: 0 0 16px rgba(254, 240, 138, 0.78);
      cursor: grab;
    }

    input[type="range"].zen-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fef08a 55%, #a78bfa 100%);
      border: 1.5px solid rgba(255, 252, 235, 0.92);
      box-shadow: 0 0 16px rgba(254, 240, 138, 0.78);
      cursor: grab;
    }

    /* Deliberate Ego UI for Chapter 5 Phase 1 */
    .ego-panel {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(246, 240, 255, 0.92));
      border: 2px solid rgba(167, 139, 250, 0.58);
      box-shadow: 0 12px 34px rgba(139, 92, 246, 0.2);
      transition: opacity 0.2s linear, transform 0.2s ease, filter 0.2s linear;
    }

    .ego-btn {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f59e0b 100%);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 10px 28px rgba(236, 72, 153, 0.35), 0 0 0 4px rgba(139, 92, 246, 0.16);
      letter-spacing: 0.18em;
      transition: transform 0.12s ease, opacity 0.2s linear, filter 0.2s linear;
    }

    .ego-btn:active {
      transform: scale(0.95);
    }

    @keyframes egoJitter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 1px); }
      50% { transform: translate(3px, -1px); }
      75% { transform: translate(-2px, -1px); }
      100% { transform: translate(0, 0); }
    }

    .jitter-now {
      animation: egoJitter 0.22s ease-in-out;
    }

    /* Smooth Visibility Transitions */
    .fade-layer {
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.65s ease;
    }

    .fade-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Traditional Red Zen Seal */
    .zen-seal {
      border: 1px solid rgba(214, 82, 74, 0.82);
      color: rgba(236, 110, 98, 0.95);
      writing-mode: vertical-rl;
      letter-spacing: 0.14em;
      font-size: 0.68rem;
      padding: 3px 2px;
      border-radius: 3px;
      background: rgba(185, 55, 45, 0.1);
    }

    /* Custom subtle scrollbar for hub on very small screens */
    .zen-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .zen-scroll::-webkit-scrollbar-thumb {
      background: rgba(196, 181, 253, 0.28);
      border-radius: 999px;
    }

    #scrollCanvas {
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(254, 240, 138, 0.3);
    }
  </style>
</head>
<body>
  <!-- Fullscreen Interactive Canvas -->
  <canvas id="mainCanvas"></canvas>
  <div class="paper-grain"></div>

  <!-- =========================================================================
       GLOBAL PERSISTENT TOP CONTROLS (BACK TO HUB + AUDIO MUTE)
       ========================================================================= -->
  <div class="fixed top-4 left-4 sm:top-5 sm:left-6 z-40 pointer-events-none">
    <button
      id="backHubBtn"
      type="button"
      class="hud-btn pointer-events-auto px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-full text-xs sm:text-sm tracking-[0.16em] flex items-center gap-1.5 cursor-pointer fade-layer fade-hidden"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
      <span>返回選單</span>
    </button>
  </div>

  <div class="fixed top-4 right-4 sm:top-5 sm:right-6 z-40 flex items-center gap-2">
    <button
      id="soundBtn"
      type="button"
      title="開啟或關閉禪音"
      aria-label="切換音效"
      class="hud-btn w-10 h-10 sm:w-11 sm:h-11 rounded-full flex items-center justify-center cursor-pointer"
    >
      <svg id="iconSoundOn" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H3v6h3l5 4V5z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07M18.36 5.64a9 9 0 010 12.73" />
      </svg>
      <svg id="iconSoundOff" class="w-5 h-5 hidden opacity-60" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H3v6h3l5 4V5z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M22 9l-6 6M16 9l6 6" />
      </svg>
    </button>
  </div>

  <!-- =========================================================================
       1. UNIFIED CHAPTER SELECT HUB (章節選單)
       ========================================================================= -->
  <section id="hubOverlay" class="fixed inset-0 z-30 overflow-y-auto zen-scroll fade-layer">
    <div class="min-h-full w-full flex flex-col items-center justify-center px-4 py-14 sm:px-8 sm:py-16">
      <div class="w-full max-w-5xl flex flex-col items-center">
        <!-- Header Title & Lotus Emblem -->
        <div class="text-center mb-8 sm:mb-10 relative">
          <div class="flex justify-center mb-3">
            <svg class="w-12 h-12 sm:w-14 sm:h-14 text-amber-200/90" viewBox="0 0 64 64" fill="none">
              <circle cx="32" cy="32" r="24" stroke="rgba(196,181,253,0.35)" stroke-width="1" stroke-dasharray="3 5" />
              <path d="M32 12C36 22 36 32 32 42C28 32 28 22 32 12Z" stroke="#fef08a" stroke-width="1.25" fill="rgba(254,240,138,0.1)" />
              <path d="M32 42C23 38 17 30 15 21C24 23 30 30 32 42Z" stroke="rgba(196,181,253,0.85)" stroke-width="1.2" />
              <path d="M32 42C41 38 47 30 49 21C40 23 34 30 32 42Z" stroke="rgba(196,181,253,0.85)" stroke-width="1.2" />
              <circle cx="32" cy="46" r="2" fill="#fbbf24" />
            </svg>
          </div>
          <h1 class="text-4xl sm:text-5xl font-semibold tracking-[0.28em] text-stone-100 pl-3 mb-2.5 drop-shadow-[0_4px_20px_rgba(167,139,250,0.35)]">
            空明・見性
          </h1>
          <p class="text-xs sm:text-sm tracking-[0.34em] text-amber-200/85 font-light">
            空掉意識・佛心印心・明心見性
          </p>
          <p id="hubProgressText" class="mt-3 text-[11px] sm:text-xs tracking-[0.2em] text-purple-200/75">
            已圓滿章節：0 / 5
          </p>
        </div>

        <!-- Five Chapter Cards (Responsive Constellation Grid) -->
        <div id="chapterGrid" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 mb-8">
          <!-- Dynamically populated by JS for crisp progress seal updates -->
        </div>

        <!-- Extra Hub Tools: Daily 5-Min Meditation + Scroll Generator -->
        <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-4 w-full">
          <button
            id="hubMeditationBtn"
            type="button"
            class="zen-btn-secondary px-6 py-3 rounded-full text-xs sm:text-sm flex items-center gap-2 cursor-pointer"
          >
            <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path stroke-linecap="round" d="M12 7v5l3 2" />
            </svg>
            <span>每日靜心模式（5分鐘）</span>
          </button>

          <button
            id="hubScrollBtn"
            type="button"
            class="zen-btn px-6 py-3 rounded-full text-xs sm:text-sm font-medium flex items-center gap-2 cursor-pointer"
          >
            <svg class="w-4 h-4 text-amber-200" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>禪行心鏡卷軸</span>
          </button>
        </div>

        <p class="mt-6 text-[11px] tracking-[0.2em] text-stone-400/70 text-center">
          全五章皆可自由點選體驗・建議開啟聲音聆聽頌缽與古琴
        </p>
      </div>
    </div>
  </section>

  <!-- =========================================================================
       2. SHARED IN-GAME PROGRESS HUD (CHAPTERS 1, 2, 4)
       ========================================================================= -->
  <header id="gameHud" class="fixed top-4 left-1/2 -translate-x-1/2 z-20 w-[56%] max-w-xs sm:max-w-sm pointer-events-none fade-layer fade-hidden">
    <div class="px-4 py-2.5 rounded-2xl bg-[#0e101c]/68 border border-purple-300/20 backdrop-blur-md">
      <div class="flex items-baseline justify-between text-xs sm:text-sm tracking-widest text-stone-200 mb-1.5">
        <span id="hudTitle" class="font-light text-purple-200">心鏡透明度</span>
        <span id="hudPct" class="font-medium text-amber-200 tabular-nums">0%</span>
      </div>
      <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
        <div
          id="hudBar"
          class="h-full rounded-full transition-all duration-300 ease-out"
          style="width: 0%; background: linear-gradient(90deg, #a78bfa 0%, #c4b5fd 50%, #fef08a 100%);"
        ></div>
      </div>
      <div class="mt-1 flex items-center justify-between text-[10px] sm:text-[11px] tracking-wider text-stone-400">
        <span id="hudSubLeft">靜心調息</span>
        <span id="hudSubRight"></span>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       3. CHAPTER 3 TOP REALMS BAR & BOTTOM SLIDERS
       ========================================================================= -->
  <nav id="ch3Nav" class="fixed top-4 left-1/2 -translate-x-1/2 z-20 px-4 py-2 rounded-full bg-[#0e101c]/70 border border-purple-300/20 backdrop-blur-md text-[11px] sm:text-xs tracking-[0.14em] text-stone-400 flex items-center gap-2 sm:gap-3 pointer-events-none fade-layer fade-hidden">
    <span id="ch3Step1">一・最究竟大理</span>
    <span class="opacity-30">·</span>
    <span id="ch3Step2">二・大圓滿法</span>
    <span class="opacity-30">·</span>
    <span id="ch3Step3">三・佛之三身</span>
  </nav>

  <div id="ch3SliderWrap" class="fixed bottom-16 sm:bottom-20 left-1/2 -translate-x-1/2 z-25 w-[88%] max-w-md px-5 py-3.5 rounded-2xl bg-[#100e1e]/78 border border-purple-300/25 backdrop-blur-md fade-layer fade-hidden">
    <div class="flex items-center justify-between text-[11px] sm:text-xs tracking-[0.16em] text-stone-300 mb-2">
      <span id="ch3SliderLeft" class="text-purple-200/85">微觀執著</span>
      <span id="ch3SliderCenter" class="text-amber-200 font-medium">觀照視野</span>
      <span id="ch3SliderRight" class="text-amber-200/90">宏觀虛空</span>
    </div>
    <input id="ch3Slider" type="range" min="0" max="100" step="0.5" value="0" class="zen-slider" />
  </div>

  <!-- =========================================================================
       4. CHAPTER 5 DECEPTIVE EGO UI & ENLIGHTENMENT OVERLAY
       ========================================================================= -->
  <div id="ch5EgoLayer" class="fixed inset-0 z-20 pointer-events-none fade-layer fade-hidden">
    <div id="ch5EgoCard" class="ego-panel rounded-2xl max-w-sm mx-auto mt-16 sm:mt-10 px-5 py-4 mx-4 pointer-events-auto">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs sm:text-sm font-semibold tracking-widest text-purple-900">功德圓滿度</span>
        <span id="ch5MeritPct" class="text-sm sm:text-base font-bold text-amber-600 tabular-nums">99.9%</span>
      </div>
      <div class="w-full h-2.5 rounded-full bg-purple-100 overflow-hidden border border-purple-300/60">
        <div class="h-full rounded-full" style="width: 99.4%; background: linear-gradient(90deg, #8b5cf6, #ec4899, #f59e0b);"></div>
      </div>
      <div class="mt-2 flex items-center justify-between text-xs tracking-wider text-purple-800/85">
        <span>修行分數：<strong class="text-fuchsia-700 font-bold">99,999</strong></span>
        <span class="text-amber-700 font-medium">距成佛僅差 0.1%</span>
      </div>
    </div>

    <div id="ch5EgoBtnWrap" class="fixed bottom-20 sm:bottom-24 left-0 right-0 flex justify-center px-5 pointer-events-none">
      <button id="ch5EgoBtn" type="button" class="ego-btn pointer-events-auto px-7 py-3.5 rounded-full text-sm sm:text-base font-semibold cursor-pointer">
        精進點擊・衝刺成佛
      </button>
    </div>
  </div>

  <section id="ch5EnlightenedOverlay" class="fixed inset-0 z-25 flex flex-col items-center justify-center px-6 text-center pointer-events-none fade-layer fade-hidden">
    <p class="text-xs sm:text-sm tracking-[0.42em] text-purple-700/75 mb-4">通過如來法則・百分之百透明</p>
    <h2
      class="text-2xl sm:text-4xl md:text-5xl font-medium tracking-[0.26em] text-[#473863] leading-relaxed mb-6"
      style="text-shadow: 0 0 32px rgba(254, 240, 138, 0.95), 0 0 12px rgba(255, 255, 255, 0.95);"
    >
      明心見性，見性成佛<br class="sm:hidden" /><span class="hidden sm:inline">，</span>利益十方眾生
    </h2>
    <div class="w-28 h-px bg-gradient-to-r from-transparent via-amber-500/60 to-transparent mb-8"></div>
    <div id="ch5FinalActions" class="flex flex-wrap items-center justify-center gap-3 pointer-events-auto opacity-0 transition-opacity duration-1000">
      <button id="ch5OpenScrollBtn" type="button" class="zen-btn-light px-7 py-3 rounded-full text-sm font-medium cursor-pointer">
        展開圓滿心鏡卷軸
      </button>
      <button id="ch5BackHubBtn" type="button" class="px-6 py-3 rounded-full text-sm tracking-[0.18em] bg-white/65 border border-purple-300/50 text-[#4c3d69] hover:bg-white/90 transition cursor-pointer">
        返回章節選單
      </button>
    </div>
  </section>

  <!-- =========================================================================
       5. DAILY 5-MINUTE MEDITATION TIMER CONTROLS
       ========================================================================= -->
  <div id="meditationControls" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-25 flex flex-col items-center gap-3 fade-layer fade-hidden">
    <div id="meditationTimerText" class="text-3xl sm:text-4xl font-light tracking-[0.22em] text-amber-100/95 tabular-nums drop-shadow-[0_2px_14px_rgba(0,0,0,0.8)]">
      05:00
    </div>
    <div class="flex items-center gap-3">
      <button id="medPauseBtn" type="button" class="zen-btn px-6 py-2.5 rounded-full text-xs sm:text-sm cursor-pointer">
        暫停調息
      </button>
      <button id="medResetBtn" type="button" class="zen-btn-secondary px-5 py-2.5 rounded-full text-xs sm:text-sm cursor-pointer">
        重置五分鐘
      </button>
    </div>
  </div>

  <!-- =========================================================================
       6. SHARED BOTTOM WHISPER & CENTER VERSE BANNER
       ========================================================================= -->
  <div id="centerBanner" class="fixed inset-0 z-25 flex flex-col items-center justify-center px-6 pointer-events-none fade-layer fade-hidden">
    <p id="bannerSub" class="text-xs sm:text-sm tracking-[0.34em] text-purple-200/85 mb-2.5"></p>
    <h2 id="bannerTitle" class="text-2xl sm:text-4xl font-medium tracking-[0.24em] text-amber-100 text-center leading-relaxed" style="text-shadow: 0 0 28px rgba(254, 240, 138, 0.7), 0 4px 16px rgba(0,0,0,0.85);"></h2>
  </div>

  <script>
    /**

    (function () {
      'use strict';

      const CHAPTERS = [
        { id: 1, key: 'ch1', num: '第一章', title: '入靜・每日一禪定',   sub: '調息入定・觀照不執著', verse: '息心靜觀，浮雲散盡見明月' },
        { id: 2, key: 'ch2', num: '第二章', title: '共心・每週一法會',   sub: '放下對立・同乘大法船', verse: '萬燈共心，照破無明長夜' },
        { id: 3, key: 'ch3', num: '第三章', title: '開悟・契悟三聖教',   sub: '破相見真・三身歸一如', verse: '天地萬物皆空相，本自俱足如來' },
        { id: 4, key: 'ch4', num: '第四章', title: '大願・接引利他',     sub: '柔和微光・順緣不強求', verse: '順緣分享，微光綿延成星河' },
        { id: 5, key: 'ch5', num: '最終章', title: '見性・通過如來法則', sub: '無為靜止・百分之百透明', verse: '明心見性，見性成佛，利益十方眾生' }
      ];

      const STORAGE_KEY = 'luminance_tathagata_completed_v1';
      let completedChapters = new Set();

      function loadProgress() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) completedChapters = new Set(arr);
          }
        } catch (e) { /* Ignore storage restrictions */ }
      }

      function markChapterCompleted(chapterId) {
        completedChapters.add(chapterId);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedChapters]));
        } catch (e) { /* Ignore storage restrictions */ }
        renderHubCards();
      }

      /* -----------------------------------------------------------------------
         2. SHARED WEB AUDIO API ZEN SYNTHESIZER (ZERO EXTERNAL FILES)
         ----------------------------------------------------------------------- */
      class ZenAudioEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.initialized = false;
          this.master = null;
          this.droneGain = null;
          this.droneFilter = null;
          this.choirGain = null;
          this.choirFilter = null;
        }

        init() {
          if (this.initialized) {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            return;
          }
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();
            const now = this.ctx.currentTime;

            this.master = this.ctx.createGain();
            this.master.gain.setValueAtTime(this.enabled ? 0.85 : 0.0, now);
            this.master.connect(this.ctx.destination);

            // Warm Om Drone (136.1Hz + Fifth + Octave)
            this.droneFilter = this.ctx.createBiquadFilter();
            this.droneFilter.type = 'lowpass';
            this.droneFilter.frequency.setValueAtTime(220, now);

            this.droneGain = this.ctx.createGain();
            this.droneGain.gain.setValueAtTime(0.0001, now);
            this.droneFilter.connect(this.droneGain);
            this.droneGain.connect(this.master);

            [
              { f: 136.1, g: 0.15, t: 'sine', d: -2 },
              { f: 204.15, g: 0.06, t: 'triangle', d: 2 },
              { f: 272.2, g: 0.04, t: 'sine', d: -1 }
            ].forEach((n) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = n.t;
              osc.frequency.setValueAtTime(n.f, now);
              osc.detune.setValueAtTime(n.d, now);
              g.gain.setValueAtTime(n.g, now);
              osc.connect(g);
              g.connect(this.droneFilter);
              osc.start(now);
            });

            // Celestial Harmonic Choir Pad
            this.choirFilter = this.ctx.createBiquadFilter();
            this.choirFilter.type = 'lowpass';
            this.choirFilter.frequency.setValueAtTime(550, now);

            this.choirGain = this.ctx.createGain();
            this.choirGain.gain.setValueAtTime(0.0001, now);
            this.choirFilter.connect(this.choirGain);
            this.choirGain.connect(this.master);

            [272.2, 342.95, 408.3, 544.4, 685.9].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = i % 2 === 0 ? 'sine' : 'triangle';
              osc.frequency.setValueAtTime(freq, now);
              osc.detune.setValueAtTime((i - 2) * 4.5, now);
              g.gain.setValueAtTime(0.024, now);
              osc.connect(g);
              g.connect(this.choirFilter);
              osc.start(now);
            });

            this.initialized = true;
          } catch (e) { /* Gracefully degrade */ }
        }

        updateAtmosphere(droneLevel, clarity, choirLevel) {
          if (!this.initialized || !this.ctx) return;
          const now = this.ctx.currentTime;
          this.droneGain.gain.setTargetAtTime(Math.max(0.0001, droneLevel), now, 0.5);
          this.droneFilter.frequency.setTargetAtTime(200 + clarity * 620, now, 0.6);
          this.choirGain.gain.setTargetAtTime(Math.max(0.0001, choirLevel), now, 0.55);
          this.choirFilter.frequency.setTargetAtTime(480 + choirLevel * 1600, now, 0.65);
        }

        toggle() {
          this.init();
          this.enabled = !this.enabled;
          if (this.master && this.ctx) {
            this.master.gain.setTargetAtTime(this.enabled ? 0.85 : 0.0, this.ctx.currentTime, 0.14);
          }
          return this.enabled;
        }

        /** Tibetan Singing Bowl (頌缽) */
        playBowl(pitchMult = 1.0) {
          if (!this.initialized || !this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const base = 272.2 * pitchMult;
          [
            { r: 1.0, a: 0.19, d: 5.2 },
            { r: 1.004, a: 0.14, d: 4.8 },
            { r: 2.756, a: 0.065, d: 3.3 },
            { r: 5.4, a: 0.022, d: 2.0 }
          ].forEach((p) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(base * p.r, now);
            g.gain.setValueAtTime(0.0001, now);
            g.gain.linearRampToValueAtTime(p.a, now + 0.05);
            g.gain.exponentialRampToValueAtTime(0.0001, now + p.d);
            osc.connect(g);
            g.connect(this.master);
            osc.start(now);
            osc.stop(now + p.d + 0.12);
          });
        }

        /** Pentatonic Guzheng / Guqin Pluck (宮商角徵羽) */
        playGuzheng(step = 0) {
          if (!this.initialized || !this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const scale = [293.66, 329.63, 392.0, 440.0, 493.88, 587.33, 659.25];
          const f = scale[Math.abs(step) % scale.length];
          [1, 2].forEach((m, idx) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = idx === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(f * m, now + idx * 0.04);
            g.gain.setValueAtTime(0.0001, now + idx * 0.04);
            g.gain.linearRampToValueAtTime(idx === 0 ? 0.15 : 0.04, now + idx * 0.04 + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.04 + (idx === 0 ? 3.0 : 1.7));
            osc.connect(g);
            g.connect(this.master);
            osc.start(now + idx * 0.04);
            osc.stop(now + idx * 0.04 + 3.1);
          });
        }

        /** Soft Ink Drop Tone */
        playInkDrop() {
          if (!this.initialized || !this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(86, now + 0.18);
          g.gain.setValueAtTime(0.0001, now);
          g.gain.linearRampToValueAtTime(0.14, now + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
          osc.connect(g);
          g.connect(this.master);
          osc.start(now);
          osc.stop(now + 0.25);
        }

        /** Gentle Dissonance when rushing/clinging */
        playDissonance() {
          if (!this.initialized || !this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          [370, 392, 523].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.detune.setValueAtTime((i - 1) * 14, now);
            g.gain.setValueAtTime(0.0001, now);
            g.gain.linearRampToValueAtTime(0.055, now + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
            osc.connect(g);
            g.connect(this.master);
            osc.start(now);
            osc.stop(now + 0.55);
          });
        }

        /** Deep Resonant Temple Bell (法鐘) */
        playTempleBell() {
          if (!this.initialized || !this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const f0 = 136.1;
          [
            { r: 1.0, a: 0.28, d: 9.8 },
            { r: 1.003, a: 0.19, d: 9.2 },
            { r: 2.0, a: 0.13, d: 6.8 },
            { r: 2.99, a: 0.08, d: 5.2 },
            { r: 4.18, a: 0.045, d: 3.8 },
            { r: 6.0, a: 0.022, d: 2.5 }
          ].forEach((h) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f0 * h.r, now);
            g.gain.setValueAtTime(0.0001, now);
            g.gain.linearRampToValueAtTime(h.a, now + 0.025);
            g.gain.exponentialRampToValueAtTime(0.0001, now + h.d);
            osc.connect(g);
            g.connect(this.master);
            osc.start(now);
            osc.stop(now + h.d + 0.2);
          });
        }
      }

      const audio = new ZenAudioEngine();

        app.width = window.innerWidth;
        app.height = window.innerHeight;
        app.dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(app.width * app.dpr);
        canvas.height = Math.floor(app.height * app.dpr);
        ctx.setTransform(app.dpr, 0, 0, app.dpr, 0, 0);
        if (app.scene === 'ch3' && app.ch3.objects) layoutCh3Realm2();
        if (app.scene === 'ch4') buildCh4City();
      }

      function initCosmos() {
        app.stars = [];
        for (let i = 0; i < 110; i++) {
          app.stars.push({
            x: Math.random(),
            y: Math.random(),
            r: 0.6 + Math.random() * 1.5,
            speed: 0.8 + Math.random() * 2.0,
            phase: Math.random() * Math.PI * 2,
            gold: Math.random() > 0.6
          });
        }
        app.motes = [];
        for (let i = 0; i < 40; i++) {
          app.motes.push({
            x: Math.random() * app.width,
            y: Math.random() * app.height,
            r: 1.1 + Math.random() * 2.4,
            vy: -(6 + Math.random() * 14),
            amp: 10 + Math.random() * 22,
            spd: 0.5 + Math.random() * 1.1,
            phase: Math.random() * Math.PI * 2,
            gold: Math.random() > 0.45
          });
        }
      }

      /* -----------------------------------------------------------------------
         5. SHARED UI & FX HELPERS
         ----------------------------------------------------------------------- */
      function setWhisper(text, ms = 4200, light = false) {
        if (app.whisperTimer) clearTimeout(app.whisperTimer);
        if (!text) {
          ui.whisperText.classList.remove('opacity-100');
          ui.whisperText.classList.add('opacity-0');
          return;
        }
        ui.whisperText.textContent = text;
        ui.whisperText.style.color = light ? 'rgba(72, 56, 102, 0.92)' : 'rgba(254, 240, 185, 0.96)';
        ui.whisperText.style.textShadow = light ? '0 1px 12px rgba(255,255,255,0.9)' : '0 2px 10px rgba(0,0,0,0.85)';
        ui.whisperText.classList.remove('opacity-0');
        ui.whisperText.classList.add('opacity-100');
        if (ms > 0) {
          app.whisperTimer = setTimeout(() => {
            ui.whisperText.classList.remove('opacity-100');
            ui.whisperText.classList.add('opacity-0');
          }, ms);
        }
      }

      function setHint(text) {

          ui.hintText.classList.add('opacity-0');
          return;
        }
        ui.hintText.textContent = text;
        ui.hintText.classList.remove('opacity-0');
        ui.hintText.classList.add('opacity-100');

          app.bannerTimer = setTimeout(() => ui.centerBanner.classList.add('fade-hidden'), ms);
        }
      }

      function hideBanner() {
        if (app.bannerTimer) clearTimeout(app.bannerTimer);
        ui.centerBanner.classList.add('fade-hidden');
      }

      function updateHud(title, pct, left, right) {
        ui.hudTitle.textContent = title;
        ui.hudPct.textContent = `${Math.round(pct)}%`;
        ui.hudBar.style.width = `${Math.min(100, Math.max(0, pct)).toFixed(1)}%`;
        ui.hudSubLeft.textContent = left || '';
        ui.hudSubRight.textContent = right || '';
      }

      function spawnRipple(x, y, maxR, color = 'gold', speed = 95) {
        app.ripples.push({ x, y, r: 16, maxR, alpha: 0.78, color, speed });
      }

      function spawnBurst(x, y, count, gold = true) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 18 + Math.random() * 72;
          app.particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            r: 1.2 + Math.random() * 2.5,
            life: 1.0,
            decay: 0.5 + Math.random() * 0.5,
            color: gold ? (Math.random() > 0.35 ? '254, 240, 138' : '196, 181, 253') : '90, 95, 115'
          });
        }
      }

      function spawnFloatText(x, y, text) {
        app.floatTexts.push({ x, y, text, alpha: 1.0, vy: -22 });

      function setTopLightTheme(isLight) {

      function hideAllOverlays() {

        ui.gameHud.classList.add('fade-hidden');
        ui.ch3Nav.classList.add('fade-hidden');
        ui.ch3SliderWrap.classList.add('fade-hidden');
