<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>霓虹無椅傳說：草泥馬的遠征 | NEON CHAIRLESS ODYSSEY</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC + Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #060612;
      --bg-purple: #0d0821;
      --neon-cyan: #00f5ff;
      --neon-pink: #ff00aa;
      --neon-gold: #ffd700;
      --neon-purple: #9d00ff;
      --neon-green: #39ff14;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input[type="text"] {
      user-select: text;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at 50% 15%, #160a38 0%, #0a061c 45%, #050510 100%);
      color: #f0f4ff;
      overflow-x: hidden;
      position: relative;
    }

    .font-cyber {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
    }

    /* Animated Synthwave Grid Background */
    .cyber-grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .cyber-grid {
      position: absolute;
      bottom: -30%;
      left: -50%;
      width: 200%;
      height: 85%;
      background-image:
        linear-gradient(to right, rgba(0, 245, 255, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 170, 0.14) 1px, transparent 1px);
      background-size: 56px 56px;
      transform: perspective(500px) rotateX(68deg);
      animation: gridMove 14s linear infinite;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0) 92%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0) 92%);
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 56px; }
    }

    /* Glassmorphism Panels */
    .glass-panel {
      background: rgba(13, 10, 34, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 245, 255, 0.28);
      box-shadow:
        0 0 24px rgba(0, 245, 255, 0.12),
        inset 0 0 24px rgba(157, 0, 255, 0.08);
    }

    .glass-card-pink {
      background: rgba(24, 8, 36, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 0, 170, 0.45);
      box-shadow: 0 0 22px rgba(255, 0, 170, 0.2);
    }

    .glass-card-gold {
      background: rgba(26, 18, 10, 0.76);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 215, 0, 0.5);
      box-shadow: 0 0 24px rgba(255, 215, 0, 0.22);
    }

    /* Neon Text Glows */
    .text-glow-cyan {
      color: #e6feff;
      text-shadow: 0 0 8px #00f5ff, 0 0 20px rgba(0, 245, 255, 0.75);
    }
    .text-glow-pink {
      color: #ffe6f7;
      text-shadow: 0 0 8px #ff00aa, 0 0 20px rgba(255, 0, 170, 0.8);
    }
    .text-glow-gold {
      color: #fff8db;
      text-shadow: 0 0 8px #ffd700, 0 0 22px rgba(255, 215, 0, 0.85);
    }
    .text-glow-purple {
      color: #f3e6ff;
      text-shadow: 0 0 8px #9d00ff, 0 0 20px rgba(157, 0, 255, 0.85);
    }

    /* Neon Buttons */
    .btn-neon-cyan {
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.22), rgba(157, 0, 255, 0.28));
      border: 1.5px solid #00f5ff;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(0, 245, 255, 0.42), inset 0 0 12px rgba(0, 245, 255, 0.22);
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-neon-cyan:hover {
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.38), rgba(157, 0, 255, 0.45));
      box-shadow: 0 0 28px rgba(0, 245, 255, 0.75), inset 0 0 16px rgba(0, 245, 255, 0.38);
      transform: translateY(-2px);
    }
    .btn-neon-cyan:active {
      transform: scale(0.95);
    }

    .btn-neon-pink {
      background: linear-gradient(135deg, rgba(255, 0, 170, 0.28), rgba(157, 0, 255, 0.32));
      border: 1.5px solid #ff00aa;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 0, 170, 0.48), inset 0 0 12px rgba(255, 0, 170, 0.25);
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-neon-pink:hover {
      background: linear-gradient(135deg, rgba(255, 0, 170, 0.45), rgba(157, 0, 255, 0.5));
      box-shadow: 0 0 30px rgba(255, 0, 170, 0.8), inset 0 0 16px rgba(255, 0, 170, 0.4);
      transform: translateY(-2px);
    }
    .btn-neon-pink:active {
      transform: scale(0.95);
    }

    .btn-neon-gold {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.28), rgba(255, 115, 0, 0.3));
      border: 1.5px solid #ffd700;
      color: #fffdf0;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.48), inset 0 0 12px rgba(255, 215, 0, 0.24);
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-neon-gold:hover {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.45), rgba(255, 115, 0, 0.45));
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.85);
      transform: translateY(-2px);
    }
    .btn-neon-gold:active {
      transform: scale(0.95);
    }

    .btn-neon-danger {
      background: linear-gradient(135deg, rgba(255, 35, 70, 0.35), rgba(180, 0, 50, 0.4));
      border: 1.5px solid #ff2a55;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 42, 85, 0.65);
      animation: dangerPulse 1.1s infinite alternate;
    }
    @keyframes dangerPulse {
      from { box-shadow: 0 0 12px rgba(255, 42, 85, 0.5); transform: scale(1); }
      to { box-shadow: 0 0 28px rgba(255, 42, 85, 0.95); transform: scale(1.03); }
    }

    /* Neon SVG Drop Shadows */
    .svg-glow-cyan { filter: drop-shadow(0 0 8px rgba(0, 245, 255, 0.85)); }
    .svg-glow-pink { filter: drop-shadow(0 0 8px rgba(255, 0, 170, 0.85)); }
    .svg-glow-gold { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9)); }
    .svg-glow-purple { filter: drop-shadow(0 0 10px rgba(157, 0, 255, 0.9)); }

    /* Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    .animate-float { animation: floatSlow 3.2s ease-in-out infinite; }

    @keyframes nodFast {
      0% { transform: rotate(0deg) translateY(0); }
      35% { transform: rotate(28deg) translateY(8px); }
      100% { transform: rotate(0deg) translateY(0); }
    }
    .nodding {
      transform-origin: 50% 65%;
      animation: nodFast 0.16s ease-out;
    }

    @keyframes flagWave {
      0% { transform: rotate(-22deg); }
      50% { transform: rotate(24deg); }
      100% { transform: rotate(-22deg); }
    }
    .waving-active {
      transform-origin: bottom center;
      animation: flagWave 0.22s ease-in-out;
    }

    @keyframes shakeScreen {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 5px); }
      40% { transform: translate(8px, -6px); }
      60% { transform: translate(-6px, -4px); }
      80% { transform: translate(6px, 6px); }
    }
    .shake-screen { animation: shakeScreen 0.35s ease-in-out; }

    @keyframes flareBurst {
      0% { opacity: 0; transform: scale(0.2); }
      40% { opacity: 1; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(2.8); }
    }
    .solar-flare-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: radial-gradient(circle, #ffffff 0%, #ffd700 30%, #ff00aa 65%, transparent 100%);
      pointer-events: none;
      animation: flareBurst 1.35s ease-out forwards;
    }

    @keyframes danmakuFly {
      from { transform: translateX(105%); }
      to { transform: translateX(-140%); }
    }
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-weight: 900;
      pointer-events: none;
      animation: danmakuFly linear forwards;
    }

    @keyframes beamShoot {
      0% { transform: scaleY(0.1); opacity: 1; }
      60% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(1.1); opacity: 0; }
    }
    .neon-beam {
      transform-origin: bottom center;
      animation: beamShoot 0.45s ease-out forwards;
    }

    /* Progress Bar Neon Fill */
    .neon-bar-track {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      overflow: hidden;
    }
    .neon-bar-fill-cyan {
      background: linear-gradient(90deg, #9d00ff, #00f5ff);
      box-shadow: 0 0 14px #00f5ff;
      transition: width 0.2s ease-out;
    }
    .neon-bar-fill-pink {
      background: linear-gradient(90deg, #ff00aa, #ffd700);
      box-shadow: 0 0 14px #ff00aa;
      transition: width 0.2s ease-out;
    }
    .neon-bar-fill-gold {
      background: linear-gradient(90deg, #ff7700, #ffd700, #fff599);
      box-shadow: 0 0 16px #ffd700;
      transition: width 0.2s ease-out;
    }

    /* Toast Notification */
    #toastBox {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      opacity: 0;
      pointer-events: none;
      z-index: 70;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #toastBox.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070615; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(#00f5ff, #ff00aa); border-radius: 999px; }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Animated Cyber Background & Ambient Particles Canvas -->
  <div class="cyber-grid-bg">
    <canvas id="bgParticles" class="w-full h-full"></canvas>
    <div class="cyber-grid"></div>
  </div>

  <!-- Toast Message Box (Replaces alert) -->
  <div id="toastBox" class="glass-panel px-5 py-2.5 rounded-full text-sm font-bold text-glow-cyan border border-cyan-400/70 max-w-[90vw] text-center">
    訊息提示
  </div>

  <!-- Top Navigation HUD -->
  <header class="relative z-30 w-full max-w-5xl mx-auto px-3 sm:px-5 pt-3 pb-2">
    <div class="glass-panel rounded-2xl px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <!-- Brand Logo -->
      <button onclick="Game.goToStage(0)" class="flex items-center gap-2 text-left group">
        <span class="w-8 h-8 rounded-xl bg-gradient-to-br from-cyan-400/30 to-fuchsia-500/30 border border-cyan-400/60 flex items-center justify-center text-lg shadow-[0_0_12px_rgba(0,245,255,0.4)]">
          🦙
        </span>
        <div>
          <div class="text-xs sm:text-sm font-black tracking-wider text-glow-cyan leading-tight">霓虹無椅傳說</div>
          <div class="text-[10px] font-cyber text-fuchsia-300/80 tracking-widest">NEON CHAIRLESS</div>
        </div>
      </button>

      <!-- Stage Stepper -->
      <nav id="stageStepper" class="flex items-center gap-1 sm:gap-2 order-3 sm:order-2 w-full sm:w-auto justify-center pt-1 sm:pt-0">
        <!-- Rendered dynamically -->
      </nav>

      <!-- Controls: Chapter Jump & Sound Toggle -->
      <div class="flex items-center gap-2 order-2 sm:order-3">
        <button id="chapterMenuBtn" onclick="Game.toggleChapterMenu()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold border border-purple-400/50 bg-purple-900/30 hover:bg-purple-800/50 text-purple-200 transition">
          ⚡ 跳關
        </button>
        <button id="soundToggleBtn" onclick="SoundFX.toggleMute()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold border border-cyan-400/50 bg-cyan-900/30 hover:bg-cyan-800/50 text-cyan-200 transition flex items-center gap-1">
          <span id="soundIcon">🔊</span>
          <span class="hidden sm:inline" id="soundLabel">音效開</span>
        </button>
      </div>
    </div>

    <!-- Discreet Chapter Quick Jump Drawer -->
    <div id="chapterMenu" class="hidden mt-2 glass-panel rounded-2xl p-3 border border-fuchsia-500/40">
      <div class="text-xs text-fuchsia-300 font-bold mb-2 flex items-center justify-between">
        <span>⚡ 快速跳轉關卡 / 重溫體驗</span>
        <button onclick="Game.toggleChapterMenu()" class="text-slate-400 hover:text-white px-2">✕</button>
      </div>
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 text-xs">
        <button onclick="Game.jumpTo(0)" class="py-2 px-2 rounded-xl bg-slate-900/80 border border-slate-600 hover:border-cyan-400 text-slate-200 font-bold">🏠 標題頁</button>
        <button onclick="Game.jumpTo(1)" class="py-2 px-2 rounded-xl bg-slate-900/80 border border-cyan-500/50 hover:bg-cyan-900/40 text-cyan-200 font-bold">1. 無椅鴿訊</button>
        <button onclick="Game.jumpTo(2)" class="py-2 px-2 rounded-xl bg-slate-900/80 border border-pink-500/50 hover:bg-pink-900/40 text-pink-200 font-bold">2. 鴿子怒吼</button>
        <button onclick="Game.jumpTo(3)" class="py-2 px-2 rounded-xl bg-slate-900/80 border border-amber-500/50 hover:bg-amber-900/40 text-amber-200 font-bold">3. 欺騙太陽</button>
        <button onclick="Game.jumpTo(4)" class="py-2 px-2 rounded-xl bg-slate-900/80 border border-purple-500/50 hover:bg-purple-900/40 text-purple-200 font-bold">4. 錄音照日</button>
        <button onclick="Game.jumpTo(5)" class="py-2 px-2 rounded-xl bg-slate-900/80 border border-yellow-400/60 hover:bg-yellow-900/40 text-yellow-200 font-bold">🏆 合照證書</button>
      </div>
    </div>
  </header>

  <!-- Main Stage Container -->
  <main id="gameRoot" class="relative z-20 flex-1 w-full max-w-4xl mx-auto px-3 sm:px-5 pb-8 pt-2 flex flex-col justify-center">
    <!-- Dynamic Game Screens Injected Here -->
  </main>

  <!-- Reward / Intermission Modal -->
  <div id="rewardModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
    <div id="rewardModalCard" class="glass-panel rounded-3xl max-w-md w-full p-6 text-center border-2 border-cyan-400/70 relative overflow-hidden">
      <div id="rewardModalContent"></div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * 1. WEB AUDIO API NEON SYNTHESIZER SOUND SYSTEM
     *    Generates crisp procedural synth effects with zero external audio URLs.
     * ============================================================================
     */
    const SoundFX = (() => {
      let ctx = null;
      let muted = false;

      function ensureCtx() {
        if (muted) return null;
        try {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) ctx = new AudioCtx();
          }
          if (ctx && ctx.state === 'suspended') ctx.resume();
          return ctx;
        } catch (e) {
          return null;
        }
      }

      function playTone(freq, duration, type = 'sine', volume = 0.14, slideTo = null, delay = 0) {
        const c = ensureCtx();
        if (!c) return;
        try {
          const now = c.currentTime + delay;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
          }
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (e) {}
      }

      return {
        toggleMute() {
          muted = !muted;
          document.getElementById('soundIcon').textContent = muted ? '🔇' : '🔊';
          document.getElementById('soundLabel').textContent = muted ? '已靜音' : '音效開';
          if (!muted) this.click();
        },
        click() {
          playTone(680, 0.08, 'triangle', 0.12, 1120);
        },
        clean() {
          playTone(420, 0.12, 'sine', 0.14, 980);
          playTone(880, 0.1, 'triangle', 0.08, 1480, 0.05);
        },
        chairVanish() {
          playTone(540, 0.35, 'sawtooth', 0.12, 95);
          playTone(260, 0.4, 'sine', 0.12, 65, 0.08);
        },
        errorBuzz() {
          playTone(160, 0.18, 'sawtooth', 0.14, 110);
          playTone(140, 0.18, 'square', 0.1, 95, 0.08);
        },
        nod() {
          const base = 320 + Math.random() * 240;
          playTone(base, 0.07, 'triangle', 0.15, base * 1.35);
        },
        pigeonCoo() {
          playTone(520, 0.11, 'sine', 0.13, 720);
          playTone(690, 0.14, 'sine', 0.12, 480, 0.09);
        },
        pigeonRoar() {
          // Dramatic neon synth pigeon roar!
          const startF = 360 + Math.random() * 220;
          playTone(startF, 0.16, 'sawtooth', 0.13, startF * 1.65);
          playTone(startF * 1.4, 0.24, 'square', 0.09, startF * 0.55, 0.1);
        },
        splash() {
          const c = ensureCtx();
          if (!c) return;
          try {
            const bufferSize = c.sampleRate * 0.18;
            const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            const noise = c.createBufferSource();
            noise.buffer = buffer;
            const filter = c.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1100, c.currentTime);
            filter.frequency.exponentialRampToValueAtTime(320, c.currentTime + 0.18);
            const gain = c.createGain();
            gain.gain.setValueAtTime(0.18, c.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.18);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(c.destination);
            noise.start();
          } catch (e) {}
          playTone(280, 0.16, 'sine', 0.12, 90);
        },
        laserScold() {
          playTone(960, 0.18, 'sawtooth', 0.12, 240);
          playTone(1320, 0.12, 'triangle', 0.1, 440, 0.03);
        },
        solarFlare() {
          playTone(120, 0.9, 'sawtooth', 0.22, 45);
          playTone(480, 0.85, 'square', 0.12, 90, 0.04);
          playTone(880, 0.6, 'sine', 0.14, 180, 0.1);
        },
        recStart() {
          playTone(880, 0.1, 'sine', 0.14);
          playTone(1320, 0.16, 'sine', 0.15, 1320, 0.1);
        },
        flagCheer() {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          const n = notes[Math.floor(Math.random() * notes.length)];
          playTone(n, 0.1, 'triangle', 0.14, n * 1.15);
        },
        victoryFanfare() {
          const melody = [
            { f: 523.25, d: 0.14, t: 0 },
            { f: 659.25, d: 0.14, t: 0.12 },
            { f: 783.99, d: 0.14, t: 0.24 },
            { f: 1046.5, d: 0.38, t: 0.36 },
            { f: 783.99, d: 0.14, t: 0.56 },
            { f: 1046.5, d: 0.55, t: 0.7 }
          ];
          melody.forEach(m => {
            playTone(m.f, m.d, 'triangle', 0.16, null, m.t);
            playTone(m.f * 0.5, m.d, 'sine', 0.1, null, m.t);
          });
        }
      };
    })();

    /**
     * ============================================================================
     * 2. NEON VECTOR SVG ASSET LIBRARY
     *    Crisp glowing cyber-vector characters & items.
     * ============================================================================
     */
    const SVGAssets = {
      // New Employee (head wrapped in #empHead for rapid nodding)
      employee(mood = 'awkward') {
        const mouth = mood === 'happy'
          ? 'M42 54 Q50 61 58 54'
          : mood === 'determined'
          ? 'M43 56 L57 54'
          : 'M44 56 Q50 53 56 56';
        return `
        <svg viewBox="0 0 100 120" class="w-full h-full svg-glow-cyan">
          <!-- Body / Suit -->
          <path d="M26 114 L32 76 Q50 68 68 76 L74 114 Z" fill="#0d1433" stroke="#00f5ff" stroke-width="2.5"/>
          <path d="M44 74 L50 96 L56 74" fill="none" stroke="#ff00aa" stroke-width="2.5"/>
          <!-- Badge -->
          <rect x="57" y="84" width="10" height="7" rx="1.5" fill="#ffd700" opacity="0.9"/>
          <!-- Head Group (Animates on nod) -->
          <g id="empHead">
            <circle cx="50" cy="44" r="21" fill="#12183b" stroke="#00f5ff" stroke-width="2.5"/>
            <!-- Cyber Hair -->
            <path d="M30 39 Q38 18 55 21 Q70 23 71 40 Q62 31 50 32 Q37 31 30 39 Z" fill="#9d00ff" stroke="#00f5ff" stroke-width="1.5"/>
            <!-- Eyes -->
            <circle cx="42" cy="45" r="2.6" fill="#00f5ff"/>

            <!-- Sweat drop when awkward -->

            <!-- Interactive Canvas + Roar Danmaku Layer -->
            <div id="seaGameWrapper" class="relative w-full h-72 sm:h-80 rounded-2xl overflow-hidden border-2 border-pink-500/50 bg-[#050618]">
              <canvas id="pigeonSeaCanvas" class="w-full h-full block cursor-crosshair"></canvas>

            </div>

            <!-- Mobile / Desktop Action Controls -->
            <div class="mt-3 flex items-center justify-center gap-3">
              <button id="moveLeftBtn" class="btn-neon-cyan px-5 py-3 rounded-xl font-black text-sm">◀ 左移</button>
              <button id="dropChairBtn" class="btn-neon-pink flex-1 max-w-xs py-3 rounded-xl font-black text-base">

              </button>
              <button id="moveRightBtn" class="btn-neon-cyan px-5 py-3 rounded-xl font-black text-sm">右移 ▶</button>
            </div>
          </section>
        `;

        const canvas = document.getElementById('pigeonSeaCanvas');
        const ctx = canvas.getContext('2d');
        const roarLayer = document.getElementById('roarLayer');

        let W = 640, H = 320;
        const resizeCanvas = () => {
          const rect = canvas.parentElement.getBoundingClientRect();
          W = canvas.width = Math.max(300, Math.floor(rect.width));
          H = canvas.height = Math.max(260, Math.floor(rect.height));
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const pigeon = { x: W * 0.5, y: 66, vx: 0 };
        const fallingChairs = [];
        const splashes = [];
        let waveOffset = 0;
        let finished = false;

        const roarPhrases = [
          '咕咕咕啊啊啊！！',
          '我們沒有椅子！！',
          '給我沉下去！！',
          '咕——！！',
          '拒絕承認有椅子！！',
          '大海收下這些幻覺吧！！',
          '咕咕怒吼空襲！！'
        ];

        const spawnRoarDanmaku = () => {
          if (finished || !roarLayer) return;
          const el = document.createElement('div');
          const colors = ['text-glow-pink', 'text-glow-cyan', 'text-glow-gold'];
          el.className = `danmaku-item text-lg sm:text-2xl ${colors[Math.floor(Math.random() * colors.length)]}`;
          el.textContent = roarPhrases[Math.floor(Math.random() * roarPhrases.length)];
          el.style.top = (10 + Math.random() * 58) + '%';
          el.style.animationDuration = (2.6 + Math.random() * 1.8) + 's';
          roarLayer.appendChild(el);
          setTimeout(() => el.remove(), 4600);
        };

        // Continuous pigeon roar danmaku
        spawnRoarDanmaku();
        this.activeTimers.push(setInterval(() => {
          spawnRoarDanmaku();
          if (Math.random() < 0.55) SoundFX.pigeonRoar();
        }, 950));

        const dropChair = () => {
          if (finished) return;
          SoundFX.pigeonRoar();
          spawnRoarDanmaku();
          fallingChairs.push({
            x: pigeon.x + (Math.random() * 16 - 8),
            y: pigeon.y + 22,
            vy: 2.5,
            rot: 0,
            vrot: (Math.random() - 0.5) * 0.25
          });
        };

        // Controls
        document.getElementById('dropChairBtn').onclick = dropChair;
        document.getElementById('moveLeftBtn').onclick = () => { pigeon.x = Math.max(45, pigeon.x - 45); };
        document.getElementById('moveRightBtn').onclick = () => { pigeon.x = Math.min(W - 45, pigeon.x + 45); };

        canvas.addEventListener('pointermove', e => {
          const rect = canvas.getBoundingClientRect();
          pigeon.x = Math.max(40, Math.min(W - 40, e.clientX - rect.left));
        });
        canvas.addEventListener('pointerdown', e => {
          const rect = canvas.getBoundingClientRect();
          pigeon.x = Math.max(40, Math.min(W - 40, e.clientX - rect.left));
          dropChair();
        });

        const keyHandler = e => {
          if (this.stage !== 2 || finished) return;
          if (e.code === 'ArrowLeft' || e.key === 'a') pigeon.x = Math.max(40, pigeon.x - 28);
          if (e.code === 'ArrowRight' || e.key === 'd') pigeon.x = Math.min(W - 40, pigeon.x + 28);
          if (e.code === 'Space') { e.preventDefault(); dropChair(); }
        };
        window.addEventListener('keydown', keyHandler);

        const drawLoop = () => {
          ctx.clearRect(0, 0, W, H);
          waveOffset += 0.05;

          // Sky stars
          ctx.fillStyle = 'rgba(0, 245, 255, 0.35)';
          for (let i = 0; i < 18; i++) {
            const sx = (i * 73 + waveOffset * 8) % W;
            const sy = (i * 29) % (H * 0.55);
            ctx.fillRect(sx, sy, 2, 2);
          }

          // Neon Ocean
          const seaY = H - 64;
          const grad = ctx.createLinearGradient(0, seaY, 0, H);
          grad.addColorStop(0, 'rgba(0, 245, 255, 0.45)');
          grad.addColorStop(0.5, 'rgba(157, 0, 255, 0.5)');
          grad.addColorStop(1, 'rgba(10, 5, 30, 0.95)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, H);
          for (let x = 0; x <= W; x += 20) {
            const y = seaY + Math.sin(x * 0.03 + waveOffset) * 7;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(W, H);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#00f5ff';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let x = 0; x <= W; x += 20) {
            const y = seaY + Math.sin(x * 0.03 + waveOffset) * 7;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Draw Neon Pigeon Squadron (3 pigeons flying together)
          const drawPigeonAt = (px, py, scale) => {
            ctx.save();
            ctx.translate(px, py);
            ctx.scale(scale, scale);
            ctx.shadowColor = '#00f5ff';
            ctx.shadowBlur = 14;
            ctx.fillStyle = 'rgba(0, 245, 255, 0.25)';
            ctx.strokeStyle = '#00f5ff';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Flapping wing
            const flap = Math.sin(waveOffset * 3.5) * 12;
            ctx.strokeStyle = '#ff00aa';
            ctx.beginPath();
            ctx.moveTo(-6, -2);
            ctx.quadraticCurveTo(-2, -22 + flap, 14, -8);
            ctx.stroke();
            // Beak
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(22, -3);
            ctx.lineTo(31, 0);
            ctx.lineTo(22, 4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          };
          drawPigeonAt(pigeon.x - 34, pigeon.y - 14, 0.72);
          drawPigeonAt(pigeon.x + 34, pigeon.y - 14, 0.72);
          drawPigeonAt(pigeon.x, pigeon.y, 1.05);

          // Update & Draw Falling Chairs
          for (let i = fallingChairs.length - 1; i >= 0; i--) {
            const c = fallingChairs[i];
            c.vy += 0.38;
            c.y += c.vy;
            c.rot += c.vrot;

            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.rot);
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 12;
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(-10, -14, 20, 12);
            ctx.strokeRect(-12, -2, 24, 5);
            ctx.beginPath();
            ctx.moveTo(-8, 3); ctx.lineTo(-10, 14);
            ctx.moveTo(8, 3); ctx.lineTo(10, 14);
            ctx.stroke();
            ctx.restore();

            if (c.y >= seaY) {
              fallingChairs.splice(i, 1);
              SoundFX.splash();
              droppedCount++;
              this.stats.chairsDropped++;
              document.getElementById('dropCounter').textContent = `已投海椅子：${Math.min(droppedCount, TARGET_CHAIRS)} / ${TARGET_CHAIRS}`;

              // Spawn neon splash particles
              for (let p = 0; p < 14; p++) {
                splashes.push({
                  x: c.x,
                  y: seaY,
                  vx: (Math.random() - 0.5) * 7,
                  vy: -3 - Math.random() * 6,
                  life: 1,
                  color: p % 2 === 0 ? '#00f5ff' : '#ff00aa'
                });
              }

              if (droppedCount >= TARGET_CHAIRS && !finished) {
                finished = true;
                window.removeEventListener('keydown', keyHandler);
                window.removeEventListener('resize', resizeCanvas);
                this.clearLoopAndTimers();
                SoundFX.victoryFanfare();

                this.showRewardModal(`
                  <div class="text-4xl mb-2">🎁</div>
                  <div class="text-xs font-cyber text-pink-300 tracking-widest mb-1">STAGE 2 CLEAR!</div>
                  <h3 class="text-2xl font-black text-glow-pink mb-3">霓虹寶箱開啟！</h3>
                  <div class="flex items-center justify-center gap-4 my-3">
                    <div class="w-20 h-24 animate-float">${SVGAssets.chair(true)}</div>
                    <div class="w-20 h-24 animate-float" style="animation-delay:0.25s">${SVGAssets.chair(true)}</div>
                  </div>
                  <div class="text-xl font-black text-glow-gold mb-3">獲得：「兩把椅子」× 2！</div>
                  <div class="glass-card-pink rounded-2xl p-3 mb-4 text-xs text-slate-200">
                    <strong class="text-pink-300">🏅 解鎖成就：【鴿子怒吼空襲王】</strong><br/>
                    剛把十把椅子丟進海裡，結果過關又獲得兩把椅子！
                  </div>
                  <button data-next-btn class="btn-neon-gold w-full py-3.5 rounded-2xl font-black">
                    前往第三關：帶媽找經費 ➜
                  </button>
                `, () => this.goToStage(3));
              }
            }
          }

          // Update & Draw Splashes
          for (let i = splashes.length - 1; i >= 0; i--) {
            const s = splashes[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.25;
            s.life -= 0.04;
            if (s.life <= 0) {
              splashes.splice(i, 1);
              continue;
            }
            ctx.fillStyle = s.color;
            ctx.globalAlpha = s.life;
            ctx.beginPath();
            ctx.arc(s.x, s.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          }

          if (!finished) {
            this.activeRAF = requestAnimationFrame(drawLoop);
          }
        };

        this.activeRAF = requestAnimationFrame(drawLoop);
      },

          const w = visCanvas.width, h = visCanvas.height;

        };

      /**
       * Draws the 1080x1600 high-resolution neon certificate onto #certCanvas
       * and mirrors it to #certPreviewImg for seamless mobile long-press saving.
       */
      drawCertificate() {
        const canvas = document.getElementById('certCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = 1080, H = 1600;

        // 1. Deep Cyber Background
        const bgGrad = ctx.createLinearGradient(0, 0, W, H);
        bgGrad.addColorStop(0, '#070616');
        bgGrad.addColorStop(0.45, '#13082e');
        bgGrad.addColorStop(1, '#060718');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Subtle Neon Grid
        ctx.strokeStyle = 'rgba(0, 245, 255, 0.07)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 60) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 60) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Ambient Radial Glows
        const g1 = ctx.createRadialGradient(220, 320, 20, 220, 320, 420);
        g1.addColorStop(0, 'rgba(0, 245, 255, 0.22)');
        g1.addColorStop(1, 'rgba(0, 245, 255, 0)');
        ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);

        const g2 = ctx.createRadialGradient(860, 560, 20, 860, 560, 420);
        g2.addColorStop(0, 'rgba(255, 0, 170, 0.22)');
        g2.addColorStop(1, 'rgba(255, 0, 170, 0)');
        ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

        // 2. Outer Neon Gradient Border
        const borderGrad = ctx.createLinearGradient(40, 40, W - 40, H - 40);
        borderGrad.addColorStop(0, '#00f5ff');
        borderGrad.addColorStop(0.5, '#ff00aa');
        borderGrad.addColorStop(1, '#ffd700');

        ctx.save();
        ctx.strokeStyle = borderGrad;
        ctx.lineWidth = 6;
        ctx.shadowColor = '#00f5ff';
        ctx.shadowBlur = 22;
        this.roundRect(ctx, 36, 36, W - 72, H - 72, 36);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.shadowBlur = 0;
        this.roundRect(ctx, 54, 54, W - 108, H - 108, 28);
        ctx.stroke();
        ctx.restore();

        // Corner Cyber Brackets
        const drawCorner = (cx, cy, dx, dy) => {
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(cx, cy + dy * 48);
          ctx.lineTo(cx, cy);
          ctx.lineTo(cx + dx * 48, cy);
          ctx.stroke();
        };
        drawCorner(70, 70, 1, 1);
        drawCorner(W - 70, 70, -1, 1);
        drawCorner(70, H - 70, 1, -1);
        drawCorner(W - 70, H - 70, -1, -1);

        // 3. Header Title
        ctx.textAlign = 'center';
        ctx.fillStyle = '#00f5ff';
        ctx.font = '700 24px Orbitron, sans-serif';
        ctx.fillText('NEON CHAIRLESS ODYSSEY • OFFICIAL CERTIFICATE', W / 2, 122);

        ctx.save();
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 24;
        ctx.fillStyle = '#fff9d6';
        ctx.font = '900 62px "Noto Sans TC", sans-serif';
        ctx.fillText('霓虹宇宙榮耀結業證書', W / 2, 198);
        ctx.restore();

        // Player Name Banner
        ctx.fillStyle = 'rgba(0, 245, 255, 0.12)';
        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 2.5;
        this.roundRect(ctx, 180, 232, W - 360, 72, 36);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 38px "Noto Sans TC", sans-serif';
        ctx.fillText(`榮耀受證人：${this.playerName}`, W / 2, 282);

        // 4. CORE HIGHLIGHT: Player + Neon Alpaca Commemorative Duo Photo Frame
        const frameX = 96, frameY = 334, frameW = W - 192, frameH = 430;
        ctx.save();
        ctx.fillStyle = 'rgba(12, 8, 32, 0.88)';
        ctx.strokeStyle = borderGrad;
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ff00aa';
        ctx.shadowBlur = 22;
        this.roundRect(ctx, frameX, frameY, frameW, frameH, 28);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Inner Starlight Photo Backdrop
        const photoAreaX = frameX + 24;
        const photoAreaY = frameY + 24;
        const photoAreaW = frameW - 48;
        const photoAreaH = 320;

        ctx.save();
        this.roundRect(ctx, photoAreaX, photoAreaY, photoAreaW, photoAreaH, 20);
        ctx.clip();

        const pBg = ctx.createLinearGradient(photoAreaX, photoAreaY, photoAreaX + photoAreaW, photoAreaY + photoAreaH);
        pBg.addColorStop(0, '#140b36');
        pBg.addColorStop(0.5, '#240b44');
        pBg.addColorStop(1, '#091a38');
        ctx.fillStyle = pBg;
        ctx.fillRect(photoAreaX, photoAreaY, photoAreaW, photoAreaH);

        // Starlight sparkles in photo frame
        ctx.fillStyle = 'rgba(255, 215, 0, 0.7)';
        for (let i = 0; i < 28; i++) {
          const sx = photoAreaX + ((i * 97) % photoAreaW);
          const sy = photoAreaY + ((i * 53) % photoAreaH);
          ctx.beginPath();
          ctx.arc(sx, sy, (i % 3) + 1.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Left Side: Player Uploaded Photo (or Stylish Cyber Silhouette)
        const userBoxX = photoAreaX + 36;
        const userBoxY = photoAreaY + 24;
        const userBoxW = 360;
        const userBoxH = 272;

        ctx.save();
        this.roundRect(ctx, userBoxX, userBoxY, userBoxW, userBoxH, 22);
        ctx.clip();

        if (this.uploadedPhotoImg) {
          // Center-crop cover draw
          const img = this.uploadedPhotoImg;
          const imgRatio = img.width / img.height;
          const boxRatio = userBoxW / userBoxH;
          let dw, dh, dx, dy;
          if (imgRatio > boxRatio) {
            dh = userBoxH;
            dw = dh * imgRatio;
            dx = userBoxX - (dw - userBoxW) / 2;
            dy = userBoxY;
          } else {
            dw = userBoxW;
            dh = dw / imgRatio;
            dx = userBoxX;
            dy = userBoxY - (dh - userBoxH) / 2;
          }
          ctx.drawImage(img, dx, dy, dw, dh);
        } else {
          // Stylish Cyber Silhouette Avatar
          const silGrad = ctx.createLinearGradient(userBoxX, userBoxY, userBoxX, userBoxY + userBoxH);
          silGrad.addColorStop(0, '#121a45');
          silGrad.addColorStop(1, '#260d42');
          ctx.fillStyle = silGrad;
          ctx.fillRect(userBoxX, userBoxY, userBoxW, userBoxH);

          ctx.strokeStyle = '#00f5ff';
          ctx.lineWidth = 4;
          ctx.fillStyle = '#0b0e26';
          ctx.beginPath();
          ctx.arc(userBoxX + userBoxW / 2, userBoxY + 102, 54, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.arc(userBoxX + userBoxW / 2, userBoxY + 270, 108, Math.PI, 0);
          ctx.fill(); ctx.stroke();

          // Neon Visor on Silhouette
          ctx.fillStyle = '#ff00aa';
          ctx.fillRect(userBoxX + userBoxW / 2 - 36, userBoxY + 90, 72, 18);

          ctx.fillStyle = '#00f5ff';
          ctx.font = '700 20px "Noto Sans TC", sans-serif';
          ctx.fillText('（可上傳自拍照合拍）', userBoxX + userBoxW / 2, userBoxY + 245);
        }
        ctx.restore();

        // Neon rim border around player photo
        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 5;
        this.roundRect(ctx, userBoxX, userBoxY, userBoxW, userBoxH, 22);
        ctx.stroke();

        // Heart/Sparkle Connector in middle
        ctx.save();
        ctx.fillStyle = '#ff00aa';
        ctx.shadowColor = '#ff00aa';
        ctx.shadowBlur = 16;
        ctx.font = '900 44px sans-serif';
        ctx.fillText('♥', photoAreaX + 432, photoAreaY + 166);
        ctx.restore();

        // Right Side: Lovingly Drawn Neon Alpaca with Sunglasses
        this.drawCanvasAlpaca(ctx, photoAreaX + 635, photoAreaY + 178, 1.48);

        ctx.restore(); // End inner photo area clip

        // Polaroid Caption
        ctx.save();
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 12;
        ctx.font = '900 32px "Noto Sans TC", sans-serif';
        ctx.fillText('★ 榮獲草泥馬一隻・紀念合照 ★', W / 2, frameY + frameH - 30);
        ctx.restore();

        // 5. Four Stage Achievements List
        const achievements = [
          {
            badge: '🕊️ 第一關',
            title: '【全球鴿訊發起人】',
            desc: '忍住沒椅子，聽老虎講史，發動全球和平鴿',
            color: '#00f5ff'
          },
          {
            badge: '🪑 第二關',
            title: '【鴿子怒吼空襲王】',
            desc: '嘴硬否認，鴿子怒吼投椅入海，獲得兩把椅子',
            color: '#ff00aa'
          },
          {
            badge: '☀️ 第三關',
            title: '【烈日嘴砲挑戰者】',
            desc: '帶媽找經費，欺騙太陽並斥責他人，遭趕回出發地',
            color: '#ffd700'
          },
          {
            badge: '🎙️ 第四關',
            title: '【錄音照日大贏家】',
            desc: '望月開錄音照亮太陽，帶媽搖旗吶喊，喜獲草泥馬一隻',
            color: '#b84dff'
          }
        ];

        let cardY = 796;
        achievements.forEach(a => {
          ctx.save();
          ctx.fillStyle = 'rgba(15, 11, 38, 0.85)';
          ctx.strokeStyle = a.color;
          ctx.lineWidth = 2.5;
          this.roundRect(ctx, 96, cardY, W - 192, 116, 20);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'left';
          ctx.fillStyle = a.color;
          ctx.font = '900 28px "Noto Sans TC", sans-serif';
          ctx.fillText(`${a.badge}  ${a.title}`, 128, cardY + 48);

          ctx.fillStyle = '#e2e8f0';
          ctx.font = '500 24px "Noto Sans TC", sans-serif';
          ctx.fillText(a.desc, 128, cardY + 90);
          ctx.restore();

          cardY += 132;
        });

        // 6. Stats & Official Dual Neon Stamp Footer
        const now = new Date();
        const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;

        ctx.save();
        ctx.fillStyle = 'rgba(0, 245, 255, 0.09)';
        ctx.strokeStyle = 'rgba(0, 245, 255, 0.45)';
        ctx.lineWidth = 2;
        this.roundRect(ctx, 96, 1336, 560, 168, 22);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.fillStyle = '#00f5ff';
        ctx.font = '900 26px "Noto Sans TC", sans-serif';
        ctx.fillText('📊 遠征數據紀錄', 126, 1380);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 24px "Noto Sans TC", sans-serif';
        ctx.fillText(`• 點頭如搗蒜次數：${this.stats.nods} 次`, 126, 1422);
        ctx.fillText(`• 投海椅子總數：${this.stats.chairsDropped} 把  |  斥責次數：${this.stats.scolds} 次`, 126, 1456);
        ctx.fillStyle = '#ffd700';
        ctx.fillText(`• 認證日期：${dateStr}`, 126, 1490);
        ctx.restore();

        // Official Glowing Circular Stamp
        const sx = 830, sy = 1420;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(-0.14);
        ctx.strokeStyle = '#ff00aa';
        ctx.shadowColor = '#ff00aa';
        ctx.shadowBlur = 16;
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(0, 0, 96, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 82, 0, Math.PI * 2); ctx.stroke();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffd700';
        ctx.font = '900 22px "Noto Sans TC", sans-serif';
        ctx.fillText('路人老虎歷史協會', 0, -24);
        ctx.fillStyle = '#00f5ff';
        ctx.font = '900 20px "Noto Sans TC", sans-serif';
        ctx.fillText('×', 0, 4);
        ctx.fillStyle = '#ff80d5';
        ctx.font = '900 22px "Noto Sans TC", sans-serif';
        ctx.fillText('霓虹草泥馬聯盟', 0, 32);
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 16px Orbitron, sans-serif';

        const previewImg = document.getElementById('certPreviewImg');
        if (previewImg) {
          previewImg.src = canvas.toDataURL('image/png');
        }
      },

      // Draws the Neon Alpaca with Sunglasses directly on the Certificate Canvas
      drawCanvasAlpaca(ctx, cx, cy, scale = 1) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        // Rainbow Aura
        const aura = ctx.createLinearGradient(-70, -80, 70, 80);
        aura.addColorStop(0, '#00f5ff');
        aura.addColorStop(0.5, '#ff00aa');
        aura.addColorStop(1, '#ffd700');

        ctx.strokeStyle = aura;
        ctx.lineWidth = 3;
        ctx.setLineDash([7, 5]);
        ctx.beginPath();
        ctx.arc(0, -10, 76, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        // Body & Neck
        ctx.shadowColor = '#00f5ff';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#201347';
        ctx.strokeStyle = aura;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-36, 72);
        ctx.lineTo(-36, 30);
        ctx.quadraticCurveTo(-50, 12, -32, -8);
        ctx.lineTo(-28, -48);
        ctx.quadraticCurveTo(-28, -74, 0, -74);
        ctx.quadraticCurveTo(28, -74, 28, -48);
        ctx.lineTo(28, -8);
        ctx.quadraticCurveTo(50, 10, 38, 34);
        ctx.lineTo(38, 72);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Ears
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#2e1863';
        ctx.strokeStyle = '#00f5ff';
        ctx.beginPath(); ctx.moveTo(-22, -68); ctx.lineTo(-32, -102); ctx.lineTo(-8, -74); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#ff00aa';
        ctx.beginPath(); ctx.moveTo(22, -68); ctx.lineTo(32, -102); ctx.lineTo(8, -74); ctx.closePath(); ctx.fill(); ctx.stroke();

        // Neon Sunglasses
        ctx.shadowColor = '#ff00aa';
        ctx.fillStyle = '#00f5ff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.fillRect(-32, -52, 28, 16);
        ctx.strokeRect(-32, -52, 28, 16);

        ctx.fillStyle = '#ff00aa';
        ctx.fillRect(4, -52, 28, 16);
        ctx.strokeRect(4, -52, 28, 16);

        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-4, -46); ctx.lineTo(4, -46); ctx.stroke();

        // Cute Smile
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, -24, 10, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        // Bowtie
        ctx.fillStyle = '#ff00aa';
        ctx.beginPath(); ctx.moveTo(-16, 12); ctx.lineTo(0, 20); ctx.lineTo(-16, 28); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#00f5ff';
        ctx.beginPath(); ctx.moveTo(16, 12); ctx.lineTo(0, 20); ctx.lineTo(16, 28); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(0, 20, 5, 0, Math.PI * 2); ctx.fill();

        // Floating Sparkles
        ctx.fillStyle = '#ffd700';
        ctx.font = '900 22px sans-serif';
        ctx.fillText('✦', -68, -56);
        ctx.fillStyle = '#00f5ff';
        ctx.fillText('✦', 62, -62);

        ctx.restore();
      },

      roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      },

      /* Ambient Floating Neon Particles Background */
      initBgParticles() {
        const c = document.getElementById('bgParticles');
        if (!c) return;
        const ctx = c.getContext('2d');
        let w, h;
        const resize = () => {
          w = c.width = window.innerWidth;
          h = c.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const colors = ['#00f5ff', '#ff00aa', '#ffd700', '#9d00ff'];
        const pts = Array.from({ length: 42 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 1 + Math.random() * 2.4,
          vx: (Math.random() - 0.5) * 0.45,
          vy: -0.2 - Math.random() * 0.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 0.25 + Math.random() * 0.55
        }));

        const loop = () => {
          ctx.clearRect(0, 0, w, h);
          pts.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;

            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.globalAlpha = 1;
          requestAnimationFrame(loop);
        };
        loop();
      }
    };

    // Start game on window load
    window.onload = function () {
      Game.init();
    };
  </script>
</body>
